name: eslint
on:
  pull_request:
  push:
    branches:
      - dev
jobs:
  eslint:
    name: Reviewdog ESLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.2.0
        with:
          node-version-file: './registration-frontend-react/package.json'
      - name: Install dependencies
        run: npm install ./registration-frontend-react
      #- run: npm run lint
      #  working-directory: ./registration-frontend-react

      - uses: reviewdog/action-eslint@v1.33.2
        with:
          reporter: github-check
          workdir: "./registration-frontend-react"
